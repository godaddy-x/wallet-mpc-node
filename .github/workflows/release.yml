name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_PLATFORM_VERSION: "34"

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build release binaries
        run: bash build_release.sh

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: output/

  build-mobile-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          echo "y" | sdkmanager \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_PLATFORM_VERSION}.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build Android AAR (gomobile)
        run: |
          bash build_mobile.sh
          test -f output/wallet-mpc-node.aar

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-aar
          path: output/wallet-mpc-node.aar

  release:
    needs: [build-cli, build-mobile-aar]
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: release

      - name: Download AAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-aar
          path: release

      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          files=(
            wallet-mpc-node-linux-amd64
            wallet-mpc-node-linux-arm64
            wallet-mpc-node-darwin-amd64
            wallet-mpc-node-darwin-arm64
            wallet-mpc-node-windows-amd64.exe
            wallet-mpc-node.aar
          )
          missing=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || missing+=("$f")
          done
          if ((${#missing[@]} > 0)); then
            echo "missing release files: ${missing[*]}" >&2
            ls -la
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/wallet-mpc-node-linux-amd64
            release/wallet-mpc-node-linux-arm64
            release/wallet-mpc-node-darwin-amd64
            release/wallet-mpc-node-darwin-arm64
            release/wallet-mpc-node-windows-amd64.exe
            release/wallet-mpc-node.aar
            release/SHA256SUMS
